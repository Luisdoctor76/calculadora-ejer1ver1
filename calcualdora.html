<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Precios con Margen de Ganancia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f7f7f7;
      padding-top: 50px;
    }
    .card {
      max-width: 600px;
      margin: auto;
    }
    .card-header {
      background-color: #4CAF50;
      color: white;
      text-align: center;
      font-size: 1.5rem;
    }
    .input-group {
      margin-bottom: 20px;
    }
    .result {
      font-size: 1.2rem;
      margin-top: 20px;
    }
    .animate__animated {
      animation-duration: 1s;
    }
    table {
      margin-top: 30px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card animate__animated animate__fadeInUp">
    <div class="card-header">
      💰 Calculadora de Precio y Margen de Ganancia
    </div>
    <div class="card-body">
      <form id="priceForm">
        <div class="input-group">
          <span class="input-group-text">📝</span>
          <input type="text" class="form-control" id="concept" placeholder="Nombre del producto o servicio" required>
        </div>
        <div class="input-group">
          <span class="input-group-text">💵</span>
          <input type="number" class="form-control" id="cost" placeholder="Costo base del producto" required>
        </div>
        <div class="input-group">
          <span class="input-group-text">📈</span>
          <input type="number" class="form-control" id="profitMargin" placeholder="Margen de ganancia (%)" required>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success w-100">Calcular</button>
          <button type="button" id="resetBtn" class="btn btn-secondary w-100">Reiniciar</button>
        </div>
      </form>
      <div id="result" class="result text-center mt-3">
        <p id="finalPrice"></p>
        <p id="profitAmount"></p>
      </div>
      <div class="text-end mt-3">
        <button class="btn btn-outline-primary me-2" onclick="exportTableToExcel()">Exportar a Excel</button>
        <button class="btn btn-outline-danger" onclick="exportTableToPDF()">Exportar a PDF</button>
      </div>
      <table class="table table-bordered table-striped mt-3">
        <thead class="table-success">
          <tr>
            <th>Concepto</th>
            <th>Costo Base</th>
            <th>Margen (%)</th>
            <th>Precio Sugerido</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('priceForm');
    const conceptInput = document.getElementById('concept');
    const costInput = document.getElementById('cost');
    const marginInput = document.getElementById('profitMargin');
    const finalPriceText = document.getElementById('finalPrice');
    const profitAmountText = document.getElementById('profitAmount');
    const resultDiv = document.getElementById('result');
    const resetBtn = document.getElementById('resetBtn');
    const tableBody = document.getElementById('tableBody');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const concept = conceptInput.value.trim();
      const cost = parseFloat(costInput.value);
      const margin = parseFloat(marginInput.value);

      if (!concept || isNaN(cost) || isNaN(margin) || cost <= 0 || margin <= 0) {
        alert("Por favor, completa todos los campos con valores válidos.");
        return;
      }

      const profit = (cost * margin) / 100;
      const finalPrice = cost + profit;

      finalPriceText.textContent = `Precio Final Sugerido: $${finalPrice.toFixed(2)} 🎯`;
      profitAmountText.textContent = `Ganancia: $${profit.toFixed(2)} 💸`;

      const newRow = document.createElement('tr');
      newRow.innerHTML = `
        <td>${concept}</td>
        <td>$${cost.toFixed(2)}</td>
        <td>${margin.toFixed(2)}%</td>
        <td>$${finalPrice.toFixed(2)}</td>
      `;
      tableBody.appendChild(newRow);

      resultDiv.classList.remove("animate__fadeOut", "animate__fadeInUp");
      void resultDiv.offsetWidth;
      resultDiv.classList.add("animate__animated", "animate__fadeInUp");
    });

    resetBtn.addEventListener('click', function () {
      conceptInput.value = '';
      costInput.value = '';
      marginInput.value = '';
      finalPriceText.textContent = '';
      profitAmountText.textContent = '';
      resultDiv.classList.remove("animate__animated", "animate__fadeInUp");
    });
  });

  function exportTableToExcel() {
    const table = document.querySelector('table');
    const wb = XLSX.utils.table_to_book(table, { sheet: "Productos" });
    XLSX.writeFile(wb, "precios_calculados.xlsx");
  }

  function exportTableToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("Productos Calculados", 14, 16);
    const rows = Array.from(document.querySelectorAll("#tableBody tr")).map(row =>
      Array.from(row.children).map(cell => cell.textContent)
    );
    doc.autoTable({
      head: [["Concepto", "Costo Base", "Margen (%)", "Precio Sugerido"]],
      body: rows,
    });
    doc.save("precios_calculados.pdf");
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</body>
</html>
